win_themes:
  - theme: "AI trust and governance"
    detail: "watsonx.governance is purpose-built for AI regulation compliance — AWS has no equivalent"
  - theme: "Hybrid infrastructure mastery"
    detail: "IBM runs on-premises, edge, and cloud seamlessly — AWS Outposts requires full AWS dependency"
  - theme: "Regulated industry depth"
    detail: "IBM's 100+ years in FSI, healthcare, and government means pre-built compliance accelerators"
