  - id: sagemaker
    name: Amazon SageMaker
    workload: ai_ml
    value_prop: "End-to-end ML platform with Studio, pipelines, and real-time inference"
  - id: bedrock
    name: Amazon Bedrock
    workload: ai_ml
    value_prop: "Fully managed foundation models from leading AI companies via single API"
  - id: redshift
    name: Amazon Redshift
    workload: data_analytics
    value_prop: "Cloud data warehouse with serverless option and native ML integration"
  - id: s3
    name: Amazon S3
    workload: infrastructure
    value_prop: "Industry-standard object storage with 99.999999999% durability"
  - id: lambda
    name: AWS Lambda
    workload: compute
