vendor: aws
display_name: AWS

products:
  - id: ec2
    name: Amazon EC2
    workload: compute
    value_prop: "Broadest choice of instances with Graviton processors delivering 40% better price-performance"
  - id: eks
    name: Amazon EKS
    workload: compute
